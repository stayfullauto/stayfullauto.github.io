<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>particles test · full auto</title>
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;1,400&family=Manrope:wght@400..800&display=swap">
<style>
html,body{margin:0;height:100%;background:#0e0e0e;color:#e9e9ec;overflow:hidden;font:400 14px/1.4 Manrope,system-ui,sans-serif;text-transform:lowercase;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;top:max(22px,env(safe-area-inset-top));right:24px;left:24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none;z-index:2}
.ui a,.ui button{pointer-events:auto}
.back{color:#e9e9ec;text-decoration:none;font:400 20px/1 'Redaction 50',Georgia,serif}
.song{text-align:right}
.song button{all:unset;cursor:pointer;font:italic 400 clamp(18px,2.2vw,26px)/1.1 'Redaction 50',Georgia,serif;color:#e9e9ec;opacity:.85}
.song button:hover{opacity:1}
.song small{display:block;margin-top:6px;font:italic 400 14px/1.2 'Redaction 50',Georgia,serif;opacity:.5}
.drop{position:fixed;inset:12px;border:1px dashed rgba(255,255,255,.35);border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3}
body.over .drop{opacity:1}
</style>
</head>
<body>
<canvas id="c" aria-label="the full auto samurai mark drawn in drifting particles"></canvas>
<div class="ui">
  <a class="back" href="index.html">full auto</a>
  <div class="song"><button type="button" id="play">&#9654;&nbsp; play a beat</button><small id="hint">or drop any song on the page</small></div>
</div>
<div class="drop"></div>
<input type="file" id="file" accept="audio/*" hidden>

<script type="module">
import * as THREE from 'three';

// ---- the mark, sampled into points --------------------------------------------------------
// Draw the samurai mark white on a canvas, then scatter particles wherever it's solid.
async function samplePoints(count) {
  const svg = (await (await fetch('favicon.svg')).text()).replace(/<style>.*?<\/style>/s, '<style>path{fill:#fff}</style>');
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const S = 900, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'); g.drawImage(img, 0, 0, S, S);
  const d = g.getImageData(0, 0, S, S).data, pts = [];
  // also find the edge of the shape: edge pixels get extra particles, which reads like the bright
  // furry outlines in the reference
  const solid = (x, y) => x >= 0 && y >= 0 && x < S && y < S && d[(y * S + x) * 4 + 3] > 128;
  let tries = 0;
  while (pts.length < count && tries < count * 40) {
    tries++;
    const x = Math.random() * S | 0, y = Math.random() * S | 0;
    if (!solid(x, y)) continue;
    const edge = !solid(x - 6, y) || !solid(x + 6, y) || !solid(x, y - 6) || !solid(x, y + 6);
    if (!edge && Math.random() < 0.3) continue;            // thin out the inside a little
    pts.push((x / S - 0.5) * 2, -(y / S - 0.5) * 2, edge ? 1 : 0);
  }
  return pts;
}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
renderer.setClearColor(0x0e0e0e, 1);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -10, 10);

const mobile = matchMedia('(max-width: 760px)').matches || navigator.hardwareConcurrency <= 4;
const N_MARK = mobile ? 55000 : 130000, N_DUST = mobile ? 8000 : 18000;

const markPts = await samplePoints(N_MARK);
const n = markPts.length / 3 + N_DUST;
const pos = new Float32Array(n * 3), rnd = new Float32Array(n * 4);
let k = 0;
for (let i = 0; i < markPts.length; i += 3, k++) {
  pos[k * 3] = markPts[i]; pos[k * 3 + 1] = markPts[i + 1]; pos[k * 3 + 2] = 0;
  rnd[k * 4] = Math.random(); rnd[k * 4 + 1] = Math.random(); rnd[k * 4 + 2] = Math.random(); rnd[k * 4 + 3] = markPts[i + 2]; // w: on an edge
}
for (; k < n; k++) {                                         // loose dust across the whole screen
  pos[k * 3] = (Math.random() - 0.5) * 6; pos[k * 3 + 1] = (Math.random() - 0.5) * 2.4; pos[k * 3 + 2] = 0;
  rnd[k * 4] = Math.random(); rnd[k * 4 + 1] = Math.random() * 0.4; rnd[k * 4 + 2] = Math.random(); rnd[k * 4 + 3] = -1;  // w -1: dust
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('aRnd', new THREE.BufferAttribute(rnd, 4));

const uniforms = {
  uTime: { value: 0 }, uBass: { value: 0 }, uMid: { value: 0 }, uHigh: { value: 0 },
  uMouse: { value: new THREE.Vector2(9, 9) }, uPush: { value: 0 },
  uScale: { value: 0.8 }, uPx: { value: 1 }, uAspect: { value: 1 }
};

// 3D simplex noise (Ashima Arts / Stefan Gustavson, MIT)
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
// curl of a noise field: swirling motion with no sinks, so the dots drift like blown sand
vec2 curl(vec2 p, float t){
  float e=0.01;
  float a=snoise(vec3(p.x,p.y+e,t)), b=snoise(vec3(p.x,p.y-e,t));
  float c=snoise(vec3(p.x+e,p.y,t)), d=snoise(vec3(p.x-e,p.y,t));
  return vec2(a-b, -(c-d))/(2.0*e);
}`;

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: NOISE + `
    attribute vec4 aRnd;
    uniform float uTime, uBass, uMid, uHigh, uPush, uScale, uPx, uAspect;
    uniform vec2 uMouse;
    varying float vA;
    void main(){
      bool dust = aRnd.w < -0.5;
      vec2 p = position.xy * (dust ? 1.0 : uScale);
      float t = uTime * 0.12;
      // each particle wanders along the curl field; some wander far (the furry fringe), most stay close
      float reach = dust ? 0.12 : (0.004 + pow(aRnd.z, 4.0) * 0.09 + aRnd.w * pow(aRnd.x, 3.0) * 0.12) * (uScale / 0.82);
      reach *= 1.0 + uBass * 3.0;
      vec2 f = curl(p * 1.6 + aRnd.xy * 0.4, t + aRnd.x * 0.6);
      p += f * reach * 0.12;
      // a constant sideways smear, like grains caught in wind
      p.x += (snoise(vec3(p * 3.0, t * 2.0)) * 0.5 + 0.5) * pow(aRnd.y, 5.0) * 0.09 * (1.0 + uMid * 2.0);
      // the pointer scatters nearby grains
      vec2 dm = p - uMouse; float dd = length(dm * vec2(1.0, 1.0));
      p += normalize(dm + 1e-5) * uPush * 0.16 * exp(-dd * dd * 26.0) * (0.4 + aRnd.z);
      gl_Position = vec4(p.x / uAspect, p.y, 0.0, 1.0);
      float sz = dust ? 0.8 + aRnd.z * 0.9 : 0.9 + aRnd.x * 1.3 + aRnd.w * 0.6;
      gl_PointSize = sz * uPx * (1.0 + uHigh * 0.8);
      vA = dust ? 0.12 + aRnd.y * 0.35 : (0.14 + aRnd.y * 0.42 + aRnd.w * 0.3) * (1.0 + uBass * 0.7);
    }`,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 c = gl_PointCoord - 0.5; float r = dot(c, c);
      if (r > 0.25) discard;
      gl_FragColor = vec4(vec3(0.91, 0.91, 0.93) * vA * (1.0 - r * 2.0), 1.0);
    }`
});
scene.add(new THREE.Points(geo, mat));

function size() {
  const w = innerWidth, h = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  uniforms.uAspect.value = w / h;
  uniforms.uScale.value = Math.min(0.82, 0.74 * (w / h));   // the mark fits on tall phones too
  uniforms.uPx.value = dpr * (w < 760 ? 1.15 : 1.35);
}
size(); addEventListener('resize', size);

// ---- pointer --------------------------------------------------------------------------------
let push = 0, pushT = 0;
addEventListener('pointermove', e => {
  uniforms.uMouse.value.set((e.clientX / innerWidth * 2 - 1) * uniforms.uAspect.value, -(e.clientY / innerHeight * 2 - 1));
  pushT = 1;
});
addEventListener('pointerleave', () => { pushT = 0; });
document.addEventListener('mouseleave', () => { pushT = 0; });

// ---- sound: a built-in beat, or any song dropped on the page -----------------------------
let actx, an, bins, src, beat = null, el = null;
const btn = document.getElementById('play'), hint = document.getElementById('hint');
function ensureAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  an = actx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.78;
  bins = new Uint8Array(an.frequencyBinCount);
  an.connect(actx.destination);
}
function stopAll() {
  if (beat) { clearInterval(beat.id); beat.out.disconnect(); beat = null; }
  if (el) { el.pause(); el = null; }
}
// a simple kick-and-hat loop made in the browser, so the button works with no music file
function startBeat() {
  ensureAudio(); stopAll();
  const out = actx.createGain(); out.gain.value = 0.55; out.connect(an);
  let step = 0;
  const tick = () => {
    const t = actx.currentTime + 0.02;
    if (step % 4 === 0 || step % 16 === 10) {               // kick
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.18);
      g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.36);
    }
    if (step % 2 === 1) {                                    // hat
      const b = actx.createBuffer(1, actx.sampleRate * 0.05, actx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const s = actx.createBufferSource(), hp = actx.createBiquadFilter(), g = actx.createGain();
      s.buffer = b; hp.type = 'highpass'; hp.frequency.value = 7000; g.gain.value = 0.25;
      s.connect(hp); hp.connect(g); g.connect(out); s.start(t);
    }
    step++;
  };
  beat = { id: setInterval(tick, 60000 / 112 / 4), out };
  btn.innerHTML = '&#10073;&#10073;&nbsp; stop';
}
function playFile(f) {
  ensureAudio(); stopAll();
  el = new Audio(URL.createObjectURL(f)); el.loop = true;
  actx.createMediaElementSource(el).connect(an);
  actx.resume(); el.play();
  btn.innerHTML = '&#10073;&#10073;&nbsp; ' + f.name.replace(/\.[^.]+$/, '').toLowerCase().slice(0, 40);
}
btn.addEventListener('click', () => {
  if (beat || el) { stopAll(); btn.innerHTML = '&#9654;&nbsp; play a beat'; return; }
  startBeat(); actx.resume();
});
hint.style.pointerEvents = 'auto'; hint.style.cursor = 'pointer';
hint.addEventListener('click', () => document.getElementById('file').click());
document.getElementById('file').addEventListener('change', e => { if (e.target.files[0]) playFile(e.target.files[0]); });
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('over'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('over'); });
addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('over');
  const f = [...e.dataTransfer.files].find(x => x.type.startsWith('audio'));
  if (f) playFile(f);
});

function band(a, b) { let s = 0; for (let i = a; i < b; i++) s += bins[i]; return s / ((b - a) * 255); }

// ---- loop ---------------------------------------------------------------------------------
const clock = new THREE.Clock();
let bass = 0, mid = 0, high = 0;
renderer.setAnimationLoop(() => {
  uniforms.uTime.value = clock.getElapsedTime();
  if (an && (beat || el)) {
    an.getByteFrequencyData(bins);
    const b = band(1, 8), m = band(12, 80), h = band(120, 300);
    bass += (Math.max(0, b - 0.25) * 1.6 - bass) * 0.35; mid += (m - mid) * 0.2; high += (h - high) * 0.2;
  } else { bass *= 0.92; mid *= 0.92; high *= 0.92; }
  uniforms.uBass.value = bass; uniforms.uMid.value = mid; uniforms.uHigh.value = high;
  push += (pushT - push) * 0.08; pushT *= 0.985;              // the scatter fades when the pointer rests
  uniforms.uPush.value = push;
  renderer.render(scene, cam);
});
</script>
</body>
</html>
