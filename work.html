<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Splash: the name stacks down the screen line by line, then folds up into the logo at the top */

html.splashing{overflow:hidden}
#splash{position:fixed;inset:0;z-index:100;background:#000;overflow:hidden;cursor:pointer;display:none;align-items:center;justify-content:center;will-change:transform}
html.splashing #splash{display:flex}
#splash .mini{width:min(300px,62vw);height:auto;overflow:visible;fill:var(--paper)}
#splash .mini g{will-change:transform,opacity}
#splash .emblem{opacity:0;fill:var(--paper)}
#splash .std{font:600 9px var(--body);fill:var(--paper);letter-spacing:.06em;opacity:0}
html.splashing #mark svg{visibility:hidden}

/* First fold: nav on top, the mask up high, a short intro beside it, and the logo across the bottom edge */
section.fold{position:relative;height:100vh;height:100svh;min-height:540px;display:flex;flex-direction:column;overflow:hidden;padding:0}
.topnav{position:relative;z-index:60;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:clamp(16px,3vw,48px);padding:18px var(--gut) 0;font:500 14px/1 var(--body);letter-spacing:-0.01em}
.topnav a{color:var(--ink);text-decoration:none}
.navlogo svg{display:block;height:20px;width:auto;fill:var(--ink)}
.navnote{display:flex;align-items:center;gap:8px;color:var(--mute)}
.navnote i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:blink 1.6s steps(1) infinite}
.navlinks{display:flex;gap:clamp(14px,2vw,28px)}
.navlinks a{color:var(--mute);transition:color .2s}.navlinks a:hover{color:var(--ink)}
.navcta{border-bottom:1.5px solid var(--ink);padding-bottom:3px}
@media (max-width:760px){.navnote,.navlinks{display:none}.topnav{grid-template-columns:auto 1fr}.navcta{justify-self:end}}
.fold .art{position:absolute;left:0;right:0;top:9%;height:60%;width:auto;margin:0;pointer-events:none}
.intro{position:absolute;z-index:55;right:var(--gut);top:calc(40% - 40px);margin:0;text-align:left;font:500 clamp(26px,3.4vw,52px)/.95 var(--body);letter-spacing:-0.045em;pointer-events:none}
.intro .d{font:italic 400 1.1em/.9 var(--display);letter-spacing:-0.02em}
.introsub{position:absolute;z-index:55;left:var(--gut);top:calc(46% - 40px);margin:0;max-width:24ch;font:500 13px/1.45 var(--body);color:#444;pointer-events:none}
.scatter{display:flex;justify-content:space-between;margin-top:auto;padding:0 calc(var(--gut) + 6%);font:500 13px/1 var(--body);color:var(--ink);position:relative;z-index:55}
.fold .mark{padding:clamp(8px,1.2vw,16px) var(--gut) var(--gut)}
@media (max-width:760px){.intro{top:auto;bottom:calc(31vw + 110px);right:auto;left:var(--gut);font-size:30px}.introsub{top:auto;bottom:calc(31vw + 190px);left:auto;right:var(--gut);text-align:right;max-width:20ch;font-size:12px}.scatter{padding:0 var(--gut)}.fold .art{top:8%;height:52%}}

/* Work list: big titles down the page, type and client on the right; each row opens the project */
.worklist{list-style:none;margin:8px 0 0;padding:0}
.worklist li{border-bottom:1px solid var(--line)}
.worklist a{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;align-items:baseline;gap:16px;padding:clamp(14px,2vw,26px) 0 clamp(10px,1.6vw,20px);text-decoration:none;color:var(--ink)}
.wl-n{font:500 12px var(--body);color:var(--mute);align-self:start;padding-top:.6em}
.wl-t{font:400 clamp(44px,8vw,120px)/.9 var(--display);letter-spacing:-0.03em;transition:transform .45s cubic-bezier(.2,.8,.2,1),color .3s}
.wl-c{font:500 13px/1.35 var(--body);color:var(--mute);text-align:right}
.wl-c b{font-weight:500;color:var(--ink)}
.worklist:hover .wl-t{color:var(--soft)}
.worklist a:hover .wl-t,.worklist a:focus-visible .wl-t{color:var(--ink);transform:translateX(clamp(8px,2vw,28px));font-style:italic}
@media (max-width:560px){.worklist a{grid-template-columns:minmax(0,1fr) auto}.wl-n{display:none}.wl-c{font-size:11px}}
</style>
<style>
/* Layout: one narrow column like the apps, with full-bleed rows of sliding pixel titles. Single white look on purpose, same as ops. */
:root{
  --paper:#ffffff; --ink:#111111; --night:#0b0b0b; --mute:#9a9a9a; --soft:#c4c4c4; --line:#e3e3e3; --wash:#f4f4f4;
  --display:'Redaction 50',Georgia,serif;
  --body:Manrope,Arial,sans-serif;
  --mono:Manrope,Arial,sans-serif;
  --col:none; --gut:clamp(16px,2.2vw,30px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{background:var(--night);color:var(--ink);font:400 16px/1.55 var(--body);text-transform:lowercase;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--ink);color:var(--paper)}
a{color:inherit}
.wrap{margin:0;padding-left:max(var(--gut), env(safe-area-inset-left, 0px));padding-right:max(var(--gut), env(safe-area-inset-right, 0px))}
.mono{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.01em}
button{font:inherit;color:inherit;text-transform:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px}

/* Top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--night)}
.bar{position:relative;z-index:2;background:var(--paper);border-radius:0}
/* Everything that scrolls lives on one white sheet over a black page */
.mark{margin:0;padding:clamp(14px,2vw,26px) var(--gut) 0;font:400 100px/.82 var(--display);letter-spacing:-0.045em;white-space:nowrap;overflow:hidden;color:var(--ink)}
.mark span{display:block;transform-origin:0 0}
.mark svg{display:block;width:100%;height:auto;overflow:visible}
.mark svg{fill:var(--ink)}
.hero{padding-top:28px!important}
.sheet{background:var(--paper);margin:0;border-radius:0;overflow:hidden}
/* Smooth scroll: the page sits in a fixed layer that eases after the real scroll position,
   and rows bend with the speed of the scroll, the way dionpieters.dev does it */
html.glide{scroll-behavior:auto}
html.glide #view{position:fixed;inset:0;overflow:hidden;background:var(--night)}
html.glide #smooth{position:absolute;left:0;right:0;top:0;will-change:transform}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px;border-bottom:1px solid var(--line)}
.logo{font:400 26px/1 var(--display);letter-spacing:-0.02em;text-decoration:none}
.nav{display:flex;gap:22px}
.nav a{text-decoration:none;color:var(--mute);transition:color .2s}
.nav a:hover{color:var(--ink)}
@media (max-width:560px){.nav a:not(.cta){display:none}}
.nav .cta{color:var(--ink)}

/* Sliding pixel titles, the apps' signature */
.tabs{display:flex;gap:30px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;padding-left:max(var(--gut), env(safe-area-inset-left, 0px));padding-right:max(var(--gut), env(safe-area-inset-right, 0px));scroll-padding-left:var(--gut);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:0;margin:0;cursor:pointer;font:400 var(--tsize,clamp(64px,13vw,150px))/1 var(--display);letter-spacing:-0.025em;color:var(--soft);transition:color .3s}
.tab.on{color:var(--ink)}
.tab:hover{color:#8a8a8a}.tab.on:hover{color:var(--ink)}
.inset{margin:0}

/* Hero */
.hero{padding-block:56px 0;position:relative}
.eyebrow{position:relative;z-index:4;margin-top:clamp(10px,1.4vw,18px)!important;display:flex;gap:14px;align-items:center;margin-bottom:20px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--ink);display:inline-block;animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lede{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;margin-top:40px;padding-bottom:48px}
#heroTabs{margin-top:8px;gap:22px}
#heroTabs .tab{font:500 clamp(28px,4.6vw,56px)/1.1 var(--body);letter-spacing:-0.045em}
.rule{margin-top:56px;border-bottom:2px dotted var(--soft)}
.lede p.pitch{color:var(--ink);max-width:none;margin:0;font:500 clamp(28px,4vw,44px)/1.12 var(--body);letter-spacing:-0.035em;text-wrap:balance}
.lede .pitch .g{color:var(--mute)}
.lede p{margin:22px 0 0;max-width:46ch;color:#444}
/* The 3D mask floats above the page in its own layer and follows you down as you scroll */
#mask3d{position:fixed;inset:0;width:100vw;height:100vh;z-index:50;pointer-events:none;opacity:0;transition:opacity .8s ease}
#mask3d.ready{opacity:1}

.art .hint{display:block;text-align:center;color:var(--mute);margin-top:6px;transition:opacity .4s}
.byline{display:block;text-align:center;color:var(--mute);margin-top:10px}


/* Die-cut sticker */
.sticker{position:absolute;right:-6px;top:-18px;transform:rotate(-7deg);font:400 clamp(40px,5vw,58px)/.9 var(--display);letter-spacing:-0.03em;color:var(--ink);padding:10px;white-space:nowrap;pointer-events:none;
  text-shadow:9px 0 0 #fff,8.3px 3.4px 0 #fff,6.4px 6.4px 0 #fff,3.4px 8.3px 0 #fff,0 9px 0 #fff,-3.4px 8.3px 0 #fff,-6.4px 6.4px 0 #fff,-8.3px 3.4px 0 #fff,-9px 0 0 #fff,-8.3px -3.4px 0 #fff,-6.4px -6.4px 0 #fff,-3.4px -8.3px 0 #fff,0 -9px 0 #fff,3.4px -8.3px 0 #fff,6.4px -6.4px 0 #fff,8.3px -3.4px 0 #fff,5px 0 0 #fff,3.5px 3.5px 0 #fff,0 5px 0 #fff,-3.5px 3.5px 0 #fff,-5px 0 0 #fff,-3.5px -3.5px 0 #fff,0 -5px 0 #fff,3.5px -3.5px 0 #fff;
  filter:drop-shadow(0 0 .8px rgba(0,0,0,.6)) drop-shadow(0 14px 18px rgba(0,0,0,.24));animation:slap .9s .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slap{0%{transform:rotate(-16deg) scale(2.2);opacity:0}45%{transform:rotate(-6deg) scale(1);opacity:1}100%{transform:rotate(-7deg) scale(1);opacity:1}}

/* Sections */
section{padding-block:96px clamp(64px,9vw,140px)}
.sect{display:flex;justify-content:space-between;gap:16px;padding-bottom:10px;margin-bottom:0}
.h2{margin:0 0 36px;font:400 clamp(48px,8vw,96px)/.95 var(--display);letter-spacing:-0.025em}

/* Work */
/* Phone mock, drawn in the apps' own style */

/* Services */
.rows{margin:0;padding:0;list-style:none}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;padding:22px 0 20px;border-bottom:1px solid var(--line);align-items:baseline}
.rows .t{font:500 clamp(24px,3.2vw,34px)/1.1 var(--body);letter-spacing:-0.035em}
.rows .d{color:#444;max-width:48ch}
@media (max-width:640px){.rows li{grid-template-columns:1fr;gap:8px}}

/* Process: a real sequence, so it is numbered */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s}
.steps li::before{content:"0" counter(s);display:block;font:12px var(--mono);color:var(--mute);margin-bottom:28px}
.steps b{display:block;font:400 40px/1 var(--display);letter-spacing:-0.02em;font-weight:400}
.steps p{margin:12px 0 0;color:#444;font-size:15px}
@media (max-width:820px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.steps{grid-template-columns:1fr}}

/* Beliefs */
.beliefs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--line);border:1px solid var(--line)}
.beliefs div{background:var(--paper);padding:28px 22px 30px}
.beliefs b{display:block;font:500 22px/1.2 var(--body);letter-spacing:-0.03em;font-weight:500}
.beliefs p{margin:10px 0 0;color:#555;font-size:15px}
@media (max-width:760px){.beliefs{grid-template-columns:1fr}}

/* Contact */
.contact{padding-block:120px 0;text-align:center}
.contact .h2{font-size:clamp(64px,13vw,160px);margin-bottom:24px}
.contact p{margin:0 auto;max-width:40ch;color:#444}
.mail{display:inline-flex;align-items:center;gap:14px;margin-top:36px;padding:16px 22px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);cursor:pointer;font:600 15px var(--body);letter-spacing:-0.01em;transition:background .2s,color .2s}
.mail:hover{background:var(--ink);color:var(--paper)}
.mail .mono{color:inherit;opacity:.6}
.bar .wrap{border-bottom-color:var(--line)}
.foot{margin-top:120px;text-align:center;padding-bottom:36px}
.foot .landing{width:min(420px,80vw);aspect-ratio:4/3;margin:0 auto}
.foot .mono{display:block;color:var(--mute);margin-top:12px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<style>
/* Project page: the title runs huge across the top, details in a row under it, then the pictures */
.proj{padding-bottom:40px}
.p-head{padding:clamp(40px,8vh,96px) var(--gut) 0}
.p-title{margin:0;font:400 clamp(72px,19vw,300px)/.8 var(--display);letter-spacing:-0.035em}
.p-title span{display:block;overflow:hidden;padding-bottom:.2em;margin-bottom:-.16em}
.p-title span i{display:inline-block;font-style:normal;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.p-title span:nth-child(2) i{animation-delay:.08s;padding-left:clamp(24px,12vw,220px)}
@keyframes rise{from{transform:translateY(105%)}}
html.arriving .p-title span i{animation-delay:.45s}html.arriving .p-title span:nth-child(2) i{animation-delay:.53s}
.p-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:clamp(32px,5vw,64px) var(--gut) 0;padding-top:14px;border-top:1px solid var(--line);font:500 13px/1.45 var(--body)}
.p-meta dt{color:var(--mute);margin-bottom:4px}
.p-meta dd{margin:0}
.p-meta a{color:var(--ink)}
@media (max-width:640px){.p-meta{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}}
.p-copy{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(20px,5vw,80px);margin:clamp(40px,7vw,96px) var(--gut) 0}
.p-copy .lead{margin:0;font:500 clamp(22px,2.6vw,36px)/1.15 var(--body);letter-spacing:-0.035em;text-wrap:balance}
.p-copy .body p{margin:0 0 1em;max-width:56ch;color:#444}
@media (max-width:760px){.p-copy{grid-template-columns:1fr}}
.p-gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);margin:clamp(48px,8vw,120px) var(--gut) 0}
.p-gal figure{margin:0;grid-column:span 1;position:relative;overflow:hidden;background:var(--wash)}
.p-gal figure.wide{grid-column:1/-1}
.p-gal img{display:block;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px;font:500 12px var(--body);color:var(--mute);
  background:radial-gradient(120% 90% at 30% 20%,#f6f6f6 0%,#e4e4e4 55%,#d4d4d4 100%)}
.ph b{font:400 clamp(28px,5vw,72px)/1 var(--display);color:#c2c2c2;position:absolute;left:16px;top:12px;letter-spacing:-0.03em}
@media (max-width:560px){.p-gal{grid-template-columns:1fr}.p-gal figure{grid-column:1/-1}}
.p-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:clamp(10px,1.4vw,20px);margin:clamp(40px,6vw,80px) var(--gut) 0}
.p-cols div{display:flex;flex-direction:column;gap:4px;font:500 13px var(--body)}
.p-cols i{display:block;aspect-ratio:3/2;border:1px solid var(--line);margin-bottom:8px}
.p-cols span{color:var(--mute)}
.p-next{display:block;margin:clamp(64px,10vw,140px) var(--gut) 0;padding-top:18px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.p-next small{display:flex;justify-content:space-between;font:500 13px var(--body);color:var(--mute)}
.p-next > span{display:block;margin-top:8px;font:400 clamp(56px,13vw,200px)/.85 var(--display);letter-spacing:-0.035em;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.p-next:hover > span{transform:translateX(clamp(8px,2vw,32px));font-style:italic}
.p-foot{display:flex;justify-content:space-between;gap:16px;margin:56px var(--gut) 0;padding:18px 0 28px;border-top:1px solid var(--line);font:500 13px var(--body);color:var(--mute)}
.p-foot a{color:var(--ink)}
</style>
</head>

<script>
// Project page: reads the project named in the address (work.html#slug) from projects.js
(function () {
  var all = window.FA_PROJECTS || [], el = document.getElementById('proj');
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function render() {
    var slug = location.hash.slice(1), i = all.findIndex(function (p) { return p.slug === slug; }), p = all[i];
    if (!p) {
      // no project named: the full list of work
      document.title = 'work · full auto';
      el.innerHTML = '<header class="p-head"><h1 class="p-title"><span><i>all work</i></span></h1></header>' +
        '<section class="p-copy"><p class="lead">less talk. more show.</p><div class="body"><p>a selection of brands, digital experiences and products we\u2019ve brought to life. different challenges, different directions, one thing in common: we take the work seriously.</p></div></section>' +
        '<div style="margin:clamp(40px,6vw,80px) var(--gut) 0"><ol class="worklist">' + all.map(function (q, k) {
          return '<li><a href="work.html#' + q.slug + '"><span class="wl-n">' + String(k + 1).padStart(2, '0') + '</span><span class="wl-t">' + esc(q.title) + '</span><span class="wl-c">' + esc(q.type) + '<br><b>' + esc(q.client) + '</b></span></a></li>';
        }).join('') + '</ol></div>' +
        '<footer class="p-foot"><a href="index.html">\u2190 home</a><span>full auto\u00ae \u00b7 no half measures. nothing hidden.</span></footer>';
      scrollTo(0, 0); window.dispatchEvent(new Event('resize')); return;
    }
    var next = all[(i + 1) % all.length];
    document.title = p.title + ' · full auto';
    var gal = (p.images || []).map(function (im, k) {
      var n = String(k + 1).padStart(2, '0');
      return '<figure class="' + (im.wide ? 'wide' : '') + '" style="aspect-ratio:' + (im.ratio || 16 / 9) + '">' +
        (im.src ? '<img src="' + esc(im.src) + '" alt="' + esc(im.alt || p.title + ' ' + n) + '" loading="lazy">'
                : '<div class="ph"><b>' + esc(p.title) + '</b><span>image ' + n + '</span><span>replace in projects.js</span></div>') + '</figure>';
    }).join('');
    el.innerHTML =
      '<header class="p-head"><h1 class="p-title">' + p.lines.map(function (l) { return '<span><i>' + esc(l) + '</i></span>'; }).join('') + '</h1></header>' +
      '<dl class="p-meta"><div><dt>client</dt><dd>' + esc(p.client) + '</dd></div><div><dt>what it is</dt><dd>' + esc(p.type) + '</dd></div>' +
      '<div><dt>what we did</dt><dd>' + p.services.map(esc).join('<br>') + '</dd></div>' +
      '<div><dt>year</dt><dd>' + esc(p.year) + (p.url ? '<br><a href="' + esc(p.url) + '" target="_blank" rel="noopener">visit \u2197</a>' : '') + '</dd></div></dl>' +
      '<section class="p-copy"><p class="lead">' + esc(p.intro) + '</p><div class="body">' + p.body.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + '</div></section>' +
      (p.colors ? '<section class="p-cols">' + p.colors.map(function (c) { return '<div><i style="background:' + esc(c[1]) + '"></i><b>' + esc(c[0]) + '</b><span>' + esc(c[1]) + '</span></div>'; }).join('') + '</section>' : '') +
      '<section class="p-gal">' + gal + '</section>' +
      '<a class="p-next" href="work.html#' + next.slug + '"><small><span>next project</span><span>' + (((i + 1) % all.length) + 1) + ' / ' + all.length + '</span></small><span>' + esc(next.title) + ' \u2192</span></a>' +
      '<footer class="p-foot"><a href="index.html#work">\u2190 all work</a><span>full auto\u00ae \u00b7 no half measures. nothing hidden.</span></footer>';
    scrollTo(0, 0);
    window.dispatchEvent(new Event('resize'));
  }
  render();
  addEventListener('hashchange', render);
})();
</script>
<script>
// ---- Glide: eased scroll, and the whole screen warps with the speed of the scroll ----
// Like dionpieters.dev: one smooth surface that bends as it moves. A displacement filter pulls the
// sides in around the middle and bows every row, scaled by how fast you're scrolling.
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var root = document.documentElement, layer = document.getElementById('smooth');
  root.classList.add('glide');
  var view = document.createElement('div'); view.id = 'view';
  layer.parentNode.insertBefore(view, layer); view.appendChild(layer);

  // The warp map: red moves pixels sideways, green moves them up and down
  var N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  var g = c.getContext('2d'), img = g.createImageData(N, N);
  for (var j = 0; j < N; j++) for (var i = 0; i < N; i++) {
    var cx = i / (N - 1) * 2 - 1, cy = j / (N - 1) * 2 - 1, o = (j * N + i) * 4;
    var ax = cx * (1 - cy * cy) * 0.7;          // sides pinch in around the middle of the screen
    var ay = (cx * cx - 0.33) * 0.9;            // rows bow, ends trailing the middle
    img.data[o] = 128 + 127 * ax; img.data[o + 1] = 128 + 127 * ay; img.data[o + 2] = 128; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  var NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', 0); svg.setAttribute('height', 0); svg.style.position = 'absolute';
  svg.innerHTML = '<filter id="warp" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB" x="0" y="0">' +
    '<feImage id="warpMap" preserveAspectRatio="none" x="0" y="0" result="map"/>' +
    '<feDisplacementMap id="warpD" in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>';
  document.body.appendChild(svg);
  var fil = svg.querySelector('#warp'), map = svg.querySelector('#warpMap'), disp = svg.querySelector('#warpD');
  map.setAttribute('href', c.toDataURL());

  var cur = scrollY, last = scrollY, vel = 0, on = false;
  function measure() {
    document.body.style.height = layer.offsetHeight + 'px';
    var w = innerWidth, h = innerHeight;
    fil.setAttribute('width', w); fil.setAttribute('height', h);
    map.setAttribute('width', w); map.setAttribute('height', h);
  }
  measure();
  addEventListener('resize', measure);
  addEventListener('load', measure);
  if (window.ResizeObserver) new ResizeObserver(measure).observe(layer);

  // Nav links jump straight to the real position; the layer eases there
  document.querySelectorAll('a[href^="#"]').forEach(function (a) {
    a.addEventListener('click', function (ev) {
      var id = a.getAttribute('href').slice(1), t = id === 'top' ? layer : document.getElementById(id);
      if (!t) return; ev.preventDefault();
      var y = 0, n = t; while (n && n !== layer) { y += n.offsetTop; n = n.offsetParent; }
      scrollTo(0, Math.max(0, y - 16));
    });
  });

  function frame() {
    var target = scrollY;
    cur += (target - cur) * 0.085;
    if (Math.abs(target - cur) < 0.05) cur = target;
    vel += ((cur - last) - vel) * 0.2; last = cur;
    var v = Math.max(-45, Math.min(45, vel));
    layer.style.transform = 'translate3d(0,' + (-cur).toFixed(2) + 'px,0)';
    var amt = v * Math.min(innerWidth, 900) / 300;   // stronger on bigger screens, signed by direction
    if (Math.abs(amt) > 0.4) {
      disp.setAttribute('scale', amt.toFixed(1));
      if (!on) { view.style.filter = 'url(#warp)'; on = true; }
    } else if (on) { view.style.filter = ''; disp.setAttribute('scale', 0); on = false; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
